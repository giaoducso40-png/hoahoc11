<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7fafc">
  <meta name="description" content="MolQuest – học liệu tương tác Dẫn xuất hydrocarbon Hóa học 11">
  <title>MolQuest • Dẫn xuất hydrocarbon 11</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#appMain">Bỏ qua điều hướng</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <button class="brand" data-view="dashboard" aria-label="Về tổng quan">
        <span class="brand-mark">M</span><span><strong>MolQuest</strong><small>Hóa học 11</small></span>
      </button>
      <nav id="mainNav">
        <button class="nav-item active" data-view="dashboard" data-label="Tổng quan"><span>⌂</span>Tổng quan</button>
        <button class="nav-item" data-view="journey" data-label="Hành trình"><span>◇</span>Hành trình</button>
        <button class="nav-item" data-view="library" data-label="Thư viện"><span>▤</span>Thư viện</button>
        <button class="nav-item" data-view="runner" data-label="Đường đua"><span>▶</span>Đường đua Mol</button>
        <button class="nav-item" data-view="lab" data-label="Lab ảo"><span>⚗</span>Phòng thí nghiệm</button>
        <button class="nav-item" data-view="profile" data-label="Hồ sơ"><span>◎</span>Hồ sơ</button>
      </nav>
      <div class="side-bottom">
        <button id="audioToggle" class="soft-button" aria-pressed="false">Âm thanh: Tắt</button>
        <small>Dữ liệu lưu trên thiết bị này</small>
      </div>
    </aside>

    <main id="appMain" tabindex="-1">
      <header class="topbar">
        <div><p class="eyebrow">HÀNH TRÌNH DẪN XUẤT HYDROCARBON</p><h1 id="viewTitle">Tổng quan học tập</h1></div>
        <div class="top-actions"><span id="sessionClock" class="time-chip">00:00</span><button id="quickStart" class="primary-button">Học tiếp</button></div>
      </header>
      <div id="viewRoot" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="questionDialog" class="question-dialog">
    <form method="dialog" onsubmit="return false">
      <div class="dialog-head"><div><span id="questionMeta" class="pill"></span><h2 id="questionTitle">Chướng ngại kiến thức</h2></div><button class="icon-button" value="cancel" aria-label="Đóng">×</button></div>
      <div id="questionMedia" class="question-media"></div>
      <p id="questionStem" class="question-stem"></p>
      <div id="questionOptions" class="option-list"></div>
      <div id="questionFeedback" class="feedback" role="status"></div>
      <div class="dialog-actions"><button id="hintButton" class="ghost-button" type="button">Mol gợi ý</button><button id="submitAnswer" class="primary-button" type="button">Kiểm tra</button></div>
    </form>
  </dialog>

  <dialog id="mapDialog" class="map-dialog">
    <form method="dialog"><button class="icon-button map-close" value="cancel" aria-label="Đóng">×</button><img id="mapZoomImage" alt=""><p id="mapAltText"></p></form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <audio id="bgAudio" src="assets/audio/nhac-nen.mp3" loop preload="auto"></audio>
  <audio id="correctAudio" src="assets/audio/tra-loi-dung.mp3" preload="auto"></audio>
  <audio id="wrongAudio" src="assets/audio/tra-loi-sai.wav" preload="auto"></audio>
  <script src="assets/js/app.js" type="module"></script>
</body>
</html>
